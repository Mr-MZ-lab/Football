name: Tests

on:
  push:
    branches:
      - main
      - "claude/**"
      - "milad/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: test
      DEBUG: "false"
      DATABASE_URL: sqlite:///./test.db
      MODEL_PATH: ./saved_models
      FOOTBALL_DATA_API_KEY: ""
      ODDS_API_KEY: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.1.1

      - name: Install project dependencies
        run: |
          grep -v '^torch==' requirements.txt > /tmp/requirements-ci.txt
          python -m pip install -r /tmp/requirements-ci.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
